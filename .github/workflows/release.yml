name: Tự động Đóng gói & Phát hành APK

on:
  push:
    tags:
      - 'v*' # Tự động kích hoạt khi bạn tạo tag phiên bản (ví dụ v1.0.0, v1.0.1)
  workflow_dispatch: # Hoặc cho phép bạn bấm nút "Run workflow" bằng tay trên web GitHub

jobs:
  build-and-release:
    name: Build APK & Tạo GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Mã nguồn
        uses: actions/checkout@v4

      - name: 🟢 Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Cài đặt Dependencies
        run: npm ci

      - name: 🔍 Kiểm tra Typecheck & ESLint
        run: npm run check

      - name: 🚀 Cài đặt EAS CLI
        run: npm install -g eas-cli

      - name: 📱 Tự động Đóng gói APK (EAS Build Preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build -p android --profile preview --non-interactive --json > build-output.json
          cat build-output.json
          BUILD_URL=$(jq -r 'if type=="array" then (.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl) else (.artifacts.buildUrl // .artifacts.applicationArchiveUrl) end' build-output.json)
          echo "APK URL: $BUILD_URL"
          if [ -n "$BUILD_URL" ] && [ "$BUILD_URL" != "null" ]; then
            curl -L -o NutriVision.apk "$BUILD_URL"
            ls -lh NutriVision.apk
          else
            echo "Lỗi: Không lấy được link tải APK từ kết quả EAS build"
            exit 1
          fi

      - name: 📦 Lưu trữ APK vào GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutriVision-APK
          path: NutriVision.apk
          retention-days: 14

      - name: 🏷️ Tạo GitHub Release & Đăng tải APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Bản phát hành ${{ github.ref_name }}
          files: NutriVision.apk
          generate_release_notes: true
          draft: false
          prerelease: false